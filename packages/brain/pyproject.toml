[project]
name = "parsec-brain"
version = "0.1.0"
description = "parsec scoring service: GNN inference, self-validating checkpoint bundles, tau calibration. Self-hostable."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "hypercorn",
    "pydantic>=2",
    "httpx",
    # `PARSEC_CKPT=hf://<repo>/<file>` pulls the checkpoint from the Hugging Face Hub
    "huggingface_hub>=0.23",
    # inference pins — the vendored reference path was validated against these lines
    "torch>=2.2,<2.3",
    "torch-geometric>=2.5",
    "numpy>=1.26,<2",
    # symbol-graph centrality (readout cols 37-41); absent it degrades to zeros = score drift
    "tree-sitter-language-pack",
    # fallback python grammar for envs where the language pack's prebuilt dylib cannot load
    # (vendored symbol_graph PARSEC-PATCH); the same grammar version the engine port pins
    "tree-sitter-python==0.23.6",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
    "jsonschema",   # brain-api/v1 schema + example validation (test_v1.py)
]
# In-process bge-large-en-v1.5 embedder (PARSEC_EMBED_BACKEND=local, the
# default): no separate embedding service, a single proxy->brain->proxy round
# trip. The recommended self-host shape. torch is already a core dep; this adds the
# encoder + weight loader. Omit for the 'remote'/'hash' backends.
embed = [
    "transformers>=4.40,<5",
    "safetensors",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parsec_brain"]
