[project]
name = "dasein-brain"
version = "0.1.0"
description = "Hosted scoring API: GNN inference, self-validating checkpoint bundles, tau calibration. Private."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "httpx",
    # inference pins — the vendored reference path was validated against these lines
    "torch>=2.2,<2.3",
    "torch-geometric>=2.5",
    "numpy>=1.26,<2",
    # symbol-graph centrality (readout cols 37-41); absent it degrades to zeros = score drift
    "tree-sitter-language-pack",
    # fallback python grammar for envs where the language pack's prebuilt dylib cannot load
    # (vendored symbol_graph DASEIN-PATCH); the same grammar version the engine port pins
    "tree-sitter-python==0.23.6",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
    "jsonschema",   # brain-api/v1 schema + example validation (test_v1.py)
]
# In-process bge-large-en-v1.5 embedder (DASEIN_EMBED_BACKEND=local): collapses
# the dasein-embed HTTP hop so the brain is a single proxy->brain->proxy round
# trip. The Cloud Run deploy target. torch is already a core dep; this adds the
# encoder + weight loader. Omit for the 'dasein'/'hash' backends.
embed = [
    "transformers>=4.40,<5",
    "safetensors",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dasein_brain"]
