[project]
name = "dasein-brain"
version = "0.1.0"
description = "Hosted scoring API: GNN inference, self-validating checkpoint bundles, tau calibration. Private."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    # torch / torch_geometric pinned when the inference port lands
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dasein_brain"]
