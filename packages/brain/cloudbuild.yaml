# Build + deploy the brain to Cloud Run. Run from the repo root via
# scripts/deploy_brain.sh (it fills the substitutions), or directly:
#
#   gcloud builds submit packages/brain \
#     --config packages/brain/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_REPO=dasein,_SERVICE=dasein-brain,\
# _CKPT_GCS=gs://dasein-473321-ac-learning/rulehead/curator_v4_prod.pt,\
# _EMBED_BACKEND=dasein,_EMBED_URL=https://dasein-embed.example/embed
#
# The build context is packages/brain (see the submit path). The checkpoint is
# fetched from GCS INTO that context so the Docker COPY bakes it — the image
# digest then pins the exact bundle version (determinism-honest deploy).

substitutions:
  _REGION: us-central1
  _REPO: dasein                 # Artifact Registry repo (create once, see deploy_brain.sh)
  _SERVICE: dasein-brain
  _CKPT_GCS: gs://dasein-473321-ac-learning/rulehead/curator_v4_prod.pt
  # Embedder backend:
  #   local  — in-process bge-large on GPU (single hop; the recommended deploy).
  #            Bakes the weights + builds CUDA torch + deploys with an L4 GPU.
  #   parsec — real bge vectors via an external _EMBED_URL (needs a VPC connector
  #            to reach the embed pod; CPU service).
  #   hash   — deterministic TEST vectors (validates the pipeline, NOT scores).
  _EMBED_BACKEND: local
  _EMBED_URL: ''
  # HF id or GCS prefix of the bge weights to bake (local backend only). An HF
  # id downloads at build; a gs:// prefix `gcloud storage cp`s a mirror.
  _EMBED_MODEL: BAAI/bge-large-en-v1.5
  # _GPU=true attaches an L4 + builds cu121 torch; false runs the local embedder
  # on CPU (slower, but no GPU quota needed — the safe first deploy). The 'local'
  # backend works either way (torch auto-falls-back to CPU when no GPU present).
  _GPU: 'false'
  # Serving shape: single-threaded scorer -> concurrency 1, scale horizontally.
  # min-instances 1 keeps a warm instance so the proxy path never eats a cold start.
  _CONCURRENCY: '1'
  _CPU: '4'
  _MEMORY: 4Gi
  _MIN_INSTANCES: '1'
  _MAX_INSTANCES: '10'
  _TIMEOUT: '120'
  # Optional Secret Manager secret holding the bearer key (name:version), e.g.
  # dasein-brain-key:latest. Empty = no static-key gate (fine behind an authed edge).
  _BRAIN_KEY_SECRET: ''
  # Per-user entitlement gate: the platform base URL the brain validates psc_
  # keys against (/keys/validate). Set = the brain requires valid+entitled keys;
  # empty = fall back to the static _BRAIN_KEY_SECRET gate (or open). The client
  # sends the user's psc_ key as the bearer, so this needs no secret.
  _PLATFORM_URL: ''

steps:
  # 1. Fetch the checkpoint into the build context so the Dockerfile bakes it.
  - id: fetch-checkpoint
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "fetching $_CKPT_GCS -> bundle/curator_v4_prod.pt"
        gcloud storage cp "$_CKPT_GCS" bundle/curator_v4_prod.pt
        ls -lh bundle/

  # 1b. Bake the bge weights into embed-model/ for the 'local' backend (fast
  #     cold start: baked ~5s vs 60-180s pulling at boot). Skipped otherwise.
  - id: fetch-embed-model
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "$_EMBED_BACKEND" != "local" ]; then echo "backend=$_EMBED_BACKEND — no model bake"; exit 0; fi
        case "$_EMBED_MODEL" in
          gs://*) apt-get update -qq && apt-get install -y -qq curl >/dev/null
                  curl -sSL https://sdk.cloud.google.com | bash >/dev/null 2>&1
                  gcloud storage cp -r "$_EMBED_MODEL/*" embed-model/ ;;
          *)      pip install --no-cache-dir -q "huggingface_hub>=0.23"
                  python -c "from huggingface_hub import snapshot_download; \
                    snapshot_download('$_EMBED_MODEL', local_dir='embed-model', \
                    allow_patterns=['*.json','*.txt','*.safetensors','*.model'])" ;;
        esac
        ls -lh embed-model/

  # 2. Build. TORCH_INDEX picks CPU vs cu121 (GPU); EMBED_EXTRAS omitted for
  #    hash to keep that image lean. bundle/ + embed-model/ are baked here.
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # $$ = a shell var (Cloud Build reads a single $ as a build substitution).
        EXTRAS="transformers>=4.40,<5 safetensors"
        [ "$_EMBED_BACKEND" = "hash" ] && EXTRAS=""
        IDX="https://download.pytorch.org/whl/cpu"
        [ "$_GPU" = "true" ] && IDX="https://download.pytorch.org/whl/cu121"
        docker build \
          --build-arg "TORCH_INDEX=$${IDX}" \
          --build-arg "EMBED_EXTRAS=$${EXTRAS}" \
          -t "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$BUILD_ID" \
          -t "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:latest" \
          .

  # 3. Push both tags.
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE]

  # 4. Deploy to Cloud Run. Env stays minimal — _flags.py setdefault-pins the
  #    shape-critical knobs (AC_CHUNK_LINES etc.); PARSEC_SERVE_TAU is left
  #    UNSET so serving uses the checkpoint's calibrated tau, not a forced one.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        FLAGS=(
          --image "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$BUILD_ID"
          --region "$_REGION"
          --platform managed
          --port 8080
          --concurrency "$_CONCURRENCY"
          --min-instances "$_MIN_INSTANCES"
          --max-instances "$_MAX_INSTANCES"
          --timeout "$_TIMEOUT"
          --set-env-vars "PARSEC_EMBED_BACKEND=$_EMBED_BACKEND"
          --set-env-vars "PARSEC_TORCH_THREADS=$_CPU"
          --allow-unauthenticated
        )
        # Local backend loads the baked weights from /embed-model either way.
        [ "$_EMBED_BACKEND" = "local" ] && FLAGS+=(--set-env-vars "PARSEC_EMBED_MODEL_DIR=/embed-model")
        if [ "$_GPU" = "true" ]; then
          # In-process bge on an L4: attach the GPU, disable CPU throttling so the
          # model stays resident. L4 requires >=4 CPU / 16 GiB, pinned here.
          # --no-gpu-zonal-redundancy uses the default (quota-free) GPU tier;
          # zonal redundancy is a separate higher quota (g.co/cloudrun/gpu-quota).
          FLAGS+=(--gpu 1 --gpu-type nvidia-l4 --no-gpu-zonal-redundancy --no-cpu-throttling --cpu 4 --memory 16Gi)
        else
          FLAGS+=(--cpu "$_CPU" --memory "$_MEMORY")
        fi
        [ -n "$_EMBED_URL" ]         && FLAGS+=(--set-env-vars "PARSEC_EMBED_URL=$_EMBED_URL")
        [ -n "$_PLATFORM_URL" ]      && FLAGS+=(--set-env-vars "PARSEC_PLATFORM_URL=$_PLATFORM_URL")
        [ -n "$_BRAIN_KEY_SECRET" ]  && FLAGS+=(--set-secrets "PARSEC_BRAIN_KEY=$_BRAIN_KEY_SECRET")
        gcloud run deploy "$_SERVICE" "$${FLAGS[@]}"

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$BUILD_ID
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:latest

options:
  logging: CLOUD_LOGGING_ONLY
