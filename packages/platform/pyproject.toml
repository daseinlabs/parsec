[project]
name = "dasein-platform"
version = "0.1.0"
description = "Control plane minus scoring: auth glue, Stripe entitlements, brain-API keys, savings-ledger intake. Thin FastAPI over managed services (DIRECTION.md 7c). Private; SaaS-only."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "PyJWT",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dasein_platform"]
