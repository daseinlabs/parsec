[project]
name = "dasein-bench"
version = "0.1.0"
description = "cc-bench harness, grader, arms. Imports the proxy as a black-box client; imported by nothing."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dasein_bench"]
