[package]
name = "dasein-proxy"
description = "The dasein binary: local data-plane proxy (also the Team cloud gateway), plus mcp / hook / statusline subcommands."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dasein"
path = "src/main.rs"

[dependencies]
dasein-engine = { path = "../engine" }
dasein-mapgen = { path = "../mapgen" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
regex = "1"
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
futures-util.workspace = true
# planned: rmcp (MCP) — added with the port

[features]
# v1-contract local ONNX embedder (forwards the engine gate); default builds
# stay light — see docs/brain-serving-v0.md "v1 migration status" appendix.
onnx = ["dasein-engine/onnx"]
