[package]
name = "parsec-proxy"
description = "The parsec binary: local data-plane proxy (also the Team cloud gateway), plus mcp / hook / statusline subcommands."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "parsec"
path = "src/main.rs"

[dependencies]
parsec-engine = { path = "../engine" }
parsec-mapgen = { path = "../mapgen" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
regex = "1"
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
futures-util.workspace = true
zstd = "0.13.3"
flate2 = "1.1.9"
tiktoken-rs = { version = "0.12.0", default-features = false }
# planned: rmcp (MCP) — added with the port
