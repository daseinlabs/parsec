[project]
name = "dasein-trainer"
version = "0.1.0"
description = "Server-side training, eval gates, checkpoint promotion; containerized for the enterprise on-prem fine-tune pipeline. Private."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    # torch / torch_geometric pinned when the trainer lineage port lands
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dasein_trainer"]
