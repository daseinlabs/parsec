name: ci

on:
  push:
    branches: [main]
  pull_request:

# Fork-safe by construction: nothing here reads a secret, and release.yml only
# publishes on tags. Flags live in the Makefile so local `make check` and CI
# cannot drift.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"   # keep in step with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: make fmt
      - run: make clippy
      - run: make rust-test
      - name: fixtures committed
        # Parity fixtures are the port's definition of done (DIRECTION.md §7b);
        # an accidentally emptied fixtures dir must fail loudly, not pass vacuously.
        run: |
          test -n "$(ls -A packages/engine/parity/fixtures)"
          test -n "$(ls -A packages/proxy/parity/fixtures)"

  # Release-shaped build of the binary on the platforms ci.yml's Linux job
  # cannot cover: the tray, desktop, and installer runtime code only compile
  # here. Catches a platform break on the PR instead of on the tag.
  build-matrix:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: windows-latest
            platform: win-x64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p parsec-proxy
      - run: ./target/release/parsec${{ matrix.ext }} --version

  deny:
    name: cargo deny (licenses, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Not cargo-deny-action: it runs in a musl container whose toolchain
      # rust-toolchain.toml overrides to 1.98.0-musl, which is not installed there.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  python:
    name: python helpers (ruff, contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff jsonschema
      - run: make lint-py
      - name: contracts examples validate
        # DIRECTION.md §8 contracts-drift: every committed example must satisfy
        # its schema, so a schema change that orphans a producer fails here.
        run: python scripts/check_contracts.py

  brain:
    name: scoring service (pytest, hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/brain/pyproject.toml
      - name: install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch>=2.2,<2.3"
          pip install "./packages/brain[test]"
      # No checkpoint in CI: the golden/parity tests skip loudly (conftest.py);
      # the `no_ckpt`-marked suites (edge construction, embed cache, gunzip)
      # run for real. Point PARSEC_CKPT at a checkpoint to run everything.
      - run: make brain-test

  # DIRECTION.md §8 invariants, each as a real job as it lands:
  #   cache-stability-golden : packages/proxy/tests/golden_conversation.rs (in `rust`)
  #   featurization-parity   : packages/engine/tests/parity_*.rs (in `rust`)
  #   contracts-drift        : `python` job above
  #   fail-open floor        : counted at runtime; not yet a CI gate
