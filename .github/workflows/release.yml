name: release

# Builds the per-platform `parsec` binaries and publishes the assembled plugin
# to the public marketplace repo daseinlabs/plugins (DIRECTION.md §7b:
# distribution is git-clone with no build step, so binaries ship prebuilt).
#
# Publishing is TAG-ONLY (docs/release-channels.md). Pushes to main still run
# the cross-platform build matrix — ci.yml is Linux-only, so this is where a
# macOS or Windows build break surfaces before a release — but nothing ships.
# Tags classify into two channels:
#   v0.X.0 (stable) — the plugins repo tree is refreshed (plugin + binaries +
#                     install scripts) and BOTH channels of latest.json
#                     advance. Marketplace and install-script users live here.
#   v0.X.Y (patch)  — latest.json's `patch` channel advances and the install
#                     scripts refresh (both text-only); the rest of the tree
#                     stays at the last stable. Patch binaries exist solely
#                     as release assets.
# Every tag also becomes a GitHub Release ON daseinlabs/plugins carrying the
# per-platform binaries and a sha256 manifest — that is the permanent
# versioned history. The plugins repo history is append-only (normal commits,
# one per release, tagged); binaries land in the tree only on minors, which
# is what keeps user clones from growing ~80 MB per publish without the old
# force-push-a-single-squashed-commit trick.
# Requires the PLUGIN_PUBLISH_TOKEN secret: a fine-grained PAT with
# contents:write on daseinlabs/plugins.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:  # manual run to test the matrix without publishing

# Tag runs PUBLISH (append to the plugins repo), so they must serialize into
# ONE group or the second push fails non-fast-forward — keep them all in
# `release`. Main-push runs only build the matrix as CI and must NOT join that
# group: a main build (or an unrelated PR merge) holding `release` starves the
# tag run that actually publishes, which is how v0.2.5's tag run was cancelled
# behind someone else's merge. Non-tag runs get a per-ref group instead.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || format('release-ci-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14        # arm64
            platform: darwin-arm64
          # darwin-x64 skipped: macos-13 (last Intel runner) is no longer
          # available. Revisit via cross-compile (x86_64-apple-darwin target
          # on macos-14) if Intel-Mac users show up.
          - os: ubuntu-latest   # x64
            platform: linux-x64
          - os: windows-latest  # x64
            platform: win-x64   # matches bin/parsec.cmd dispatch
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # PARSEC_DEFAULT_BRAIN_URL is baked into the binary at compile time
      # (brain.rs BAKED_BRAIN_URL): released plugins reach the production
      # brain with zero user configuration. Runtime PARSEC_BRAIN_URL still
      # overrides; dev/CI builds (no env here) bake nothing. The baked
      # default implies the v2 contract (chunk text to the brain, which
      # embeds) — see BrainConfig::from_env.
      #
      # No model ships with the client since 2026-07-20: the embedder moved
      # server-side (docs/server-side-embedding.md), so the `onnx` feature,
      # the PARSEC_DEFAULT_MODEL_* repo variables, and first-run model
      # download are all gone. Install → first session → curation on, with
      # no 1.3GB download in the middle.
      # PARSEC_DEFAULT_PLATFORM_URL is baked the same way (ledger_ship.rs
      # BAKED_PLATFORM_URL): released binaries know where to POST savings-ledger
      # rows. Shipping still requires a per-user PARSEC_API_KEY at runtime (the
      # psc_ key the user mints in the dashboard), so no rows leave without it.
      - run: cargo build --release -p parsec-proxy
        env:
          PARSEC_DEFAULT_BRAIN_URL: ${{ vars.PARSEC_DEFAULT_BRAIN_URL }}
          PARSEC_DEFAULT_PLATFORM_URL: ${{ vars.PARSEC_DEFAULT_PLATFORM_URL }}
      # Launch smoke: a binary that builds but can't start must fail HERE,
      # not on a user's machine after install.
      - run: ./target/release/parsec${{ matrix.ext }} --version
      # NOTE (2026-07-20): this bundling existed because ort's /MD prebuilts
      # forced the dynamic CRT. ort is gone, so the C++ runtime (msvcp140) is
      # very likely no longer imported — but that is UNVERIFIED on a clean
      # Windows box, and the failure mode if we are wrong is silent
      # (0xC0000135, no stderr, undiagnosable from a hook error). Kept until
      # a win-x64 release is dumpbin-checked; ~750 KB is cheap insurance.
      # parsec.exe imports msvcp140/vcruntime140 — VC++ redistributable DLLs
      # that are present on this runner (VS is installed) but absent on clean
      # user machines, where the loader kills the process before main()
      # (0xC0000135, no stderr, undiagnosable from a hook error). App-local
      # deployment: ship the four imported DLLs (~750 KB) next to the exe.
      # The smoke test above can't catch a miss — the runner always resolves
      # them from its own redist install.
      - name: Bundle VC++ runtime DLLs
        if: matrix.platform == 'win-x64'
        shell: pwsh
        run: |
          # Locate the redist via vswhere rather than a hardcoded VS-year path:
          # the runner image's VS version moves under us (2022 → 2026 in the
          # June 2026 windows-latest migration).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $crt = & $vswhere -latest -products * -prerelease -find 'VC\Redist\MSVC\*\x64\Microsoft.VC14?.CRT' |
            Sort-Object | Select-Object -Last 1
          if (-not $crt) { Write-Error "VC redist CRT dir not found on runner"; exit 1 }
          foreach ($dll in "msvcp140.dll","msvcp140_1.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item (Join-Path $crt $dll) target/release/
          }
          Get-ChildItem target/release/*.dll
      - uses: actions/upload-artifact@v4
        with:
          name: parsec-${{ matrix.platform }}
          path: |
            target/release/parsec${{ matrix.ext }}
            target/release/msvcp140*.dll
            target/release/vcruntime140*.dll
          if-no-files-found: error

  # Assemble the full plugin (markdown/JSON + all per-platform binaries) into
  # a single downloadable zip. On tag pushes it is attached to a GitHub
  # Release; workflow_dispatch runs still get it as a CI artifact.
  pack:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags: git describe stamps dev versions
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble plugin zip
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          cp -R packages/plugin dist/parsec
          # Platform dirs are gitignored (absent in CI checkouts); clear any
          # stragglers before installing fresh builds.
          rm -rf dist/parsec/bin/darwin-arm64
          for p in darwin-arm64 linux-x64; do
            install -D -m 755 "artifacts/parsec-$p/parsec" "dist/parsec/bin/$p/parsec"
          done
          install -D -m 644 "artifacts/parsec-win-x64/parsec.exe" "dist/parsec/bin/win-x64/parsec.exe"
          # App-local VC++ CRT (see the build job's bundle step): the loader
          # only searches next to the exe, so these must sit in win-x64/.
          install -m 644 artifacts/parsec-win-x64/*.dll "dist/parsec/bin/win-x64/"
          chmod 755 dist/parsec/bin/parsec   # upload-artifact drops exec bits
          (cd dist && zip -r parsec-plugin.zip parsec)
          echo 'Unzip, then: `claude --plugin-dir ./parsec`' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: parsec-plugin
          path: dist/parsec-plugin.zip
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist/parsec-plugin.zip --clobber
      # Publish the marketplace repo users actually install from:
      #   claude plugin marketplace add https://github.com/daseinlabs/plugins
      #   claude plugin install parsec@parsec-marketplace
      - name: Publish to daseinlabs/plugins
        # Tags ONLY — main pushes and workflow_dispatch are dry runs of the
        # build matrix. Stable (v0.X.0) refreshes the whole tree; patch
        # (v0.X.Y) touches nothing but latest.json's `patch` channel. See the
        # header and docs/release-channels.md.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PUBLISH_TOKEN: ${{ secrets.PLUGIN_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.0$ ]]; then
            CHANNEL=stable
          else
            CHANNEL=patch
          fi
          echo "publishing v$VERSION (channel: $CHANNEL)"

          # The binary reports CARGO_PKG_VERSION — the workspace version in
          # the root Cargo.toml — so a tag that disagrees with it would ship
          # binaries that lie about what they are, blinding the hook's
          # plugin-updated restart and every future OTA comparison. `make
          # release VERSION=…` keeps them in step; this catches hand-cut tags.
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "tag v$VERSION != workspace version $CARGO_VERSION (Cargo.toml)." >&2
            echo "cut releases with: make release VERSION=$VERSION" >&2
            exit 1
          fi

          # Release assets: per-platform binaries, the win-x64 CRT DLLs, the
          # plugin zip, and a sha256 manifest. These — not the git tree — are
          # the permanent versioned history: immutable, per-tag, and free of
          # clone bloat. The future self-updater downloads from here.
          rm -rf assets publish
          mkdir -p assets
          cp artifacts/parsec-darwin-arm64/parsec assets/parsec-darwin-arm64
          cp artifacts/parsec-linux-x64/parsec assets/parsec-linux-x64
          cp artifacts/parsec-win-x64/parsec.exe assets/parsec-win-x64.exe
          cp artifacts/parsec-win-x64/*.dll assets/
          cp dist/parsec-plugin.zip assets/
          # Belt and braces: the built artifact must agree with the tag too
          # (artifact download drops exec bits, hence the chmod).
          chmod +x assets/parsec-darwin-arm64 assets/parsec-linux-x64
          BIN_VERSION="$(assets/parsec-linux-x64 --version)"
          if [ "$BIN_VERSION" != "parsec $VERSION" ]; then
            echo "built binary reports '$BIN_VERSION', expected 'parsec $VERSION'" >&2
            exit 1
          fi
          (cd assets && sha256sum -- * \
            | jq -Rn '[inputs | split("  ") | {(.[1]): .[0]}] | add') > sums.json
          jq -n --arg v "$VERSION" --arg tag "v$VERSION" --slurpfile s sums.json \
            '{version: $v, tag: $tag, assets: $s[0]}' > entry.json
          cp entry.json assets/manifest.json

          # Append one commit to the plugins repo — never force-push. Clone
          # is what makes append possible: we build on the published history
          # instead of re-initializing it.
          git clone "https://x-access-token:${PUBLISH_TOKEN}@github.com/daseinlabs/plugins.git" publish
          cd publish
          git config user.name "dasein-release"
          git config user.email "release@daseinlabs.ai"
          if [[ "$CHANNEL" == stable ]]; then
            # Refresh the whole tree: marketplace files, plugin + binaries,
            # install scripts. The one-line installer (`curl …/install.sh |
            # bash`) ships beside the binaries it downloads, from the same
            # commit, so the URL layout it assumes can never drift from the
            # tree it lives in. install-opencode.sh is a compat stub: that
            # URL shipped in earlier releases and must keep working.
            find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
            cp -R "$GITHUB_WORKSPACE/packages/marketplace/." .
            mkdir -p plugins
            cp -R "$GITHUB_WORKSPACE/dist/parsec" plugins/parsec
            install -m 755 "$GITHUB_WORKSPACE/scripts/install.sh" install.sh
            install -m 755 "$GITHUB_WORKSPACE/scripts/install-opencode.sh" install-opencode.sh
            install -m 644 "$GITHUB_WORKSPACE/scripts/install.ps1" install.ps1
            # plugin.json `version` is the marketplace update channel — it
            # advances only on stable, so plugin users never see patches.
            jq --arg v "$VERSION" '.version = $v' \
              plugins/parsec/.claude-plugin/plugin.json > plugin.json.tmp
            mv plugin.json.tmp plugins/parsec/.claude-plugin/plugin.json
          else
            # Patch releases keep the tree at the last stable EXCEPT the
            # install scripts: they are text-only, they download binaries
            # from the stable tree regardless (no skew possible), and an
            # installer fix should not have to wait for a minor to reach
            # the public URL.
            install -m 755 "$GITHUB_WORKSPACE/scripts/install.sh" install.sh
            install -m 755 "$GITHUB_WORKSPACE/scripts/install-opencode.sh" install-opencode.sh
            install -m 644 "$GITHUB_WORKSPACE/scripts/install.ps1" install.ps1
          fi
          # latest.json is the pollable two-channel pointer (docs/
          # release-channels.md): `stable` is pushed to everyone, `patch` is
          # opt-in. A stable release supersedes any patch on the previous
          # minor, so both channels advance together.
          [ -f latest.json ] || echo '{}' > latest.json
          if [[ "$CHANNEL" == stable ]]; then
            jq --slurpfile e ../entry.json '.stable = $e[0] | .patch = $e[0]' \
              latest.json > latest.json.tmp
          else
            jq --slurpfile e ../entry.json '.patch = $e[0]' \
              latest.json > latest.json.tmp
          fi
          mv latest.json.tmp latest.json
          git add -A
          git commit -m "parsec v$VERSION ($CHANNEL)"
          git tag "v$VERSION"
          git push origin main "v$VERSION"

          # The public, versioned artifact store: a GitHub Release on the
          # plugins repo itself (the parsec source repo is private, so its
          # releases cannot serve downloads).
          GH_TOKEN="$PUBLISH_TOKEN" gh release create "v$VERSION" \
            --repo daseinlabs/plugins \
            --title "parsec v$VERSION" \
            --notes "channel: $CHANNEL — see latest.json / manifest.json for sha256s" \
            ../assets/*
