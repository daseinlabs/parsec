name: release

# Builds the per-platform `dasein` binaries and publishes the assembled plugin
# to the public marketplace repo daseinlabs/claude-plugins (DIRECTION.md §7b:
# distribution is git-clone with no build step, so binaries ship prebuilt).
# The marketplace repo's history is force-pushed as a single squashed commit
# per release so user clones stay small. Requires the PLUGIN_PUBLISH_TOKEN
# secret: a fine-grained PAT with contents:write on daseinlabs/claude-plugins.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # manual run to test the matrix without cutting a tag

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14        # arm64
            platform: darwin-arm64
          # darwin-x64 skipped: macos-13 (last Intel runner) is no longer
          # available. Revisit via cross-compile (x86_64-apple-darwin target
          # on macos-14) if Intel-Mac users show up.
          - os: ubuntu-latest   # x64
            platform: linux-x64
          - os: windows-latest  # x64
            platform: win-x64   # matches bin/dasein.cmd dispatch
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # DASEIN_DEFAULT_BRAIN_URL is baked into the binary at compile time
      # (brain.rs BAKED_BRAIN_URL): released plugins reach the production
      # brain with zero user configuration. Runtime DASEIN_BRAIN_URL still
      # overrides; dev/CI builds (no env here) bake nothing. The baked
      # default implies the v1 (textless) contract and stays inert until a
      # real embed backend is configured — see BrainConfig::from_env.
      #
      # --features onnx ships the local embedder (setup.rs downloads the
      # model on first run), closing that loop: install → first session →
      # curation on. The DASEIN_DEFAULT_MODEL_* repo variables must point at
      # the parity-gated bge-large export (scripts/embed/export_bge_onnx.py,
      # gated by parity_gate.py) — base URL of a directory serving
      # model.onnx + tokenizer.json, plus their sha256 pins. Unset variables
      # bake nothing: the binary still works, and first-run setup records
      # "no model source configured" instead of downloading.
      # A release binary with no baked model source fails setup on every
      # user machine ("no model source configured", 0.0.4-alpha) — refuse to
      # build one. All three repo vars must be present together: a URL
      # without sha pins would ship unverified downloads.
      - name: require model source repo vars
        shell: bash
        env:
          URL: ${{ vars.DASEIN_MODEL_BASE_URL }}
          MODEL_SHA: ${{ vars.DASEIN_MODEL_SHA256 }}
          TOK_SHA: ${{ vars.DASEIN_TOKENIZER_SHA256 }}
        run: |
          missing=""
          [ -n "$URL" ] || missing="$missing DASEIN_MODEL_BASE_URL"
          [ -n "$MODEL_SHA" ] || missing="$missing DASEIN_MODEL_SHA256"
          [ -n "$TOK_SHA" ] || missing="$missing DASEIN_TOKENIZER_SHA256"
          if [ -n "$missing" ]; then
            echo "::error::repo variables unset:$missing — the binary would bake no model source. Set them under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
      - run: cargo build --release -p dasein-proxy --features onnx
        env:
          DASEIN_DEFAULT_BRAIN_URL: https://dasein-brain-939340394421.us-central1.run.app
          DASEIN_DEFAULT_MODEL_BASE_URL: ${{ vars.DASEIN_MODEL_BASE_URL }}
          DASEIN_DEFAULT_MODEL_SHA256: ${{ vars.DASEIN_MODEL_SHA256 }}
          DASEIN_DEFAULT_TOKENIZER_SHA256: ${{ vars.DASEIN_TOKENIZER_SHA256 }}
      # Link smoke: ort pulls in onnxruntime — a binary that builds but can't
      # resolve the runtime library at launch must fail HERE, not on a user's
      # machine after install.
      - run: ./target/release/dasein${{ matrix.ext }} --version
      # ort's /MD prebuilts force the dynamic CRT (see engine/Cargo.toml), so
      # dasein.exe imports msvcp140/vcruntime140 — VC++ redistributable DLLs
      # that are present on this runner (VS is installed) but absent on clean
      # user machines, where the loader kills the process before main()
      # (0xC0000135, no stderr, undiagnosable from a hook error). App-local
      # deployment: ship the four imported DLLs (~750 KB) next to the exe.
      # The smoke test above can't catch a miss — the runner always resolves
      # them from its own redist install.
      - name: Bundle VC++ runtime DLLs
        if: matrix.platform == 'win-x64'
        shell: pwsh
        run: |
          $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC14?.CRT" -Directory |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { Write-Error "VC redist CRT dir not found on runner"; exit 1 }
          foreach ($dll in "msvcp140.dll","msvcp140_1.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item (Join-Path $crt.FullName $dll) target/release/
          }
          Get-ChildItem target/release/*.dll
      - uses: actions/upload-artifact@v4
        with:
          name: dasein-${{ matrix.platform }}
          path: |
            target/release/dasein${{ matrix.ext }}
            target/release/msvcp140*.dll
            target/release/vcruntime140*.dll
          if-no-files-found: error

  # Assemble the full plugin (markdown/JSON + all per-platform binaries) into
  # a single downloadable zip. On tag pushes it is attached to a GitHub
  # Release; workflow_dispatch runs still get it as a CI artifact.
  pack:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble plugin zip
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          cp -R packages/plugin dist/dasein
          # Platform dirs are gitignored (absent in CI checkouts); clear any
          # stragglers before installing fresh builds.
          rm -rf dist/dasein/bin/darwin-arm64
          for p in darwin-arm64 linux-x64; do
            install -D -m 755 "artifacts/dasein-$p/dasein" "dist/dasein/bin/$p/dasein"
          done
          install -D -m 644 "artifacts/dasein-win-x64/dasein.exe" "dist/dasein/bin/win-x64/dasein.exe"
          # App-local VC++ CRT (see the build job's bundle step): the loader
          # only searches next to the exe, so these must sit in win-x64/.
          install -m 644 artifacts/dasein-win-x64/*.dll "dist/dasein/bin/win-x64/"
          chmod 755 dist/dasein/bin/dasein   # upload-artifact drops exec bits
          (cd dist && zip -r dasein-plugin.zip dasein)
          echo 'Unzip, then: `claude --plugin-dir ./dasein`' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dasein-plugin
          path: dist/dasein-plugin.zip
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist/dasein-plugin.zip --clobber
      # Publish the marketplace repo users actually install from:
      #   claude plugin marketplace add https://github.com/daseinlabs/claude-plugins
      #   claude plugin install dasein@dasein-marketplace
      - name: Publish to daseinlabs/claude-plugins
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PUBLISH_TOKEN: ${{ secrets.PLUGIN_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf publish && mkdir -p publish/plugins
          cp -R packages/marketplace/. publish/
          cp -R dist/dasein publish/plugins/dasein
          # plugin.json `version` is the update channel — stamp it from the tag.
          jq --arg v "$VERSION" '.version = $v' \
            publish/plugins/dasein/.claude-plugin/plugin.json > plugin.json.tmp
          mv plugin.json.tmp publish/plugins/dasein/.claude-plugin/plugin.json
          cd publish
          git init -b main
          git config user.name "dasein-release"
          git config user.email "release@dasein.rocks"
          git add -A
          git commit -m "dasein v$VERSION"
          git push --force \
            "https://x-access-token:${PUBLISH_TOKEN}@github.com/daseinlabs/claude-plugins.git" \
            main
